name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: swift test

      - name: Build app
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/bundle.sh

      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent build/TitleSwitcher.app TitleSwitcher.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" TitleSwitcher.zip --title "$GITHUB_REF_NAME" --generate-notes

      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha256="$(shasum -a 256 TitleSwitcher.zip | cut -d' ' -f1)"
          gh auth setup-git
          gh repo clone aasp-dev/homebrew-tap tap
          mkdir -p tap/Casks
          ./scripts/make-cask.sh "$version" "$sha256" > tap/Casks/title-switcher.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/title-switcher.rb
          git commit -m "title-switcher $version"
          git push
